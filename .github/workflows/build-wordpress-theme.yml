name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包歐華酒店作品位置更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("wordpress-theme")
          paths = ["daf2026/assets/js/data.js", "daf2026/assets/js/app.js"]
          data = (root / paths[0]).read_text(encoding="utf-8")
          app = (root / paths[1]).read_text(encoding="utf-8")
          expected = {
              "district-04": ("一樓大廳", "First-floor lobby"),
              "district-05": ("外騎樓", "Exterior arcade"),
              "district-06": ("歐麗蛋糕坊旁", "Beside the O'Le Bakery"),
              "district-07": ("二樓沙發區旁廊道", "Second-floor corridor beside the sofa area"),
              "district-08": ("大廳休憩區", "Lobby lounge area"),
          }
          for work_id, (zh, en) in expected.items():
              pos = data.find('"id": "' + work_id + '"')
              assert pos >= 0, f"Missing work: {work_id}"
              entry = data[pos:pos + 400]
              assert '"exhibitionLocationZh": "' + zh + '"' in entry, work_id
              assert '"exhibitionLocationEn": "' + en + '"' in entry, work_id
          assert 'workLocationName = work =>' in app
          assert 'join(isEnglish ? " | " : "｜")' in app
          assert app.count("workLocationName(catalogWork)") == 2
          assert 'const store = location.type === "district"' in app
          output = "daf2026-riviera-hotel-location-update.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              assert archive.testzip() is None
          print("Verified", output)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-riviera-hotel-location-update
          path: daf2026-riviera-hotel-location-update.zip
          if-no-files-found: error
