name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包六場藝術家講座更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          root = Path("wordpress-theme")
          name = "daf2026/assets/js/data.js"
          data = (root / name).read_text(encoding="utf-8")
          expected = {
              "talk-01": ("藝術家講座 I｜演算邊界", "Artist Talk I | Algorithmic Boundaries"),
              "talk-02": ("藝術家講座 II｜非人自動體的形塑", "Artist Talk II | Shaping Non-Human Automatons"),
              "talk-03": ("藝術家講座 III｜辨識與失認", "Artist Talk III | Recognition and Misrecognition"),
              "talk-04": ("藝術家講座 IV｜文化的歧義與能動", "Artist Talk IV | Cultural Ambiguity and Agency"),
              "talk-05": ("藝術家講座 V｜矽基裂隙", "Artist Talk V | Silicon Fissures"),
              "talk-06": ("藝術家講座 VI｜預設的逸脫", "Artist Talk VI | Departures from the Predetermined"),
          }
          for talk_id, (zh, en) in expected.items():
              match = re.search(r'"id": "' + talk_id + r'"', data)
              assert match, talk_id
              section = data[match.start():match.start() + 500]
              assert '"title": "' + zh in section, talk_id
              assert '"titleEn": "' + en in section, talk_id
          talk6 = data[data.index('"id": "talk-06"'):data.index('"id": "talk-06"') + 7000]
          assert '"artistId":"artist-18","workId":"district-07","name":"超級浪","nameEn":"Hyper Wave"' in talk6
          assert '"artist": "陳政維、黃姿婷、Bety Krňanská、超級浪"' in talk6
          assert '"artistEn": "Cheng-Wei Chen, Tzu-Ting Huang, Bety Krňanská, Hyper Wave"' in talk6
          output = "daf2026-artist-talks-six-titles-update.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert archive.namelist() == [name]
              assert archive.testzip() is None
          print("Verified", output)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-artist-talks-six-titles-update
          path: daf2026-artist-talks-six-titles-update.zip
          if-no-files-found: error
