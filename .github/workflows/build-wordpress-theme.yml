name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包本次雙語首頁更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("wordpress-theme")
          paths = ["daf2026/front-page.php", "daf2026/page-en.php"]
          for name in paths:
              assert (root / name).is_file(), f"Missing: {name}"
          zh = (root / paths[0]).read_text(encoding="utf-8")
          en = (root / paths[1]).read_text(encoding="utf-8")
          assert "第二十一屆臺北數位藝術節" in zh
          assert "21st Digital Art Festival Taipei" in en
          assert '<span class="hero-meta-label">展場｜</span>' not in zh
          assert '<span class="hero-meta-label">Venue | </span>' not in en
          assert "臺北典藏植物園、藝術入店" in zh
          assert "Taipei Collectible Botanical Garden, Art in Stores" in en
          assert "DAF2026_Hero_Logo.webm" in zh and "DAF2026_Hero_Logo.webm" in en
          output = "daf2026-20261029-hero-only-update.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              assert archive.testzip() is None
          print("Verified", output)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-20261029-hero-only-update
          path: daf2026-20261029-hero-only-update.zip
          if-no-files-found: error
