name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 打包正式預告片影片 ID 更新
        run: |
          cd wordpress-theme
          zip ../daf2026-trailer-video-update.zip \
            'daf2026/front-page.php' \
            'daf2026/page-en.php'

      - name: 驗證預告片增量包內容
        run: |
          set -e
          zipinfo -1 daf2026-trailer-video-update.zip | sort > /tmp/daf2026-actual-files.txt
          printf '%s\\n' 'daf2026/front-page.php' 'daf2026/page-en.php' | sort > /tmp/daf2026-expected-files.txt
          diff -u /tmp/daf2026-expected-files.txt /tmp/daf2026-actual-files.txt
          grep -q 'data-youtube-id="RspktCLMWWo"' wordpress-theme/daf2026/front-page.php
          grep -q 'data-youtube-id="RspktCLMWWo"' wordpress-theme/daf2026/page-en.php

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-trailer-video-update
          path: daf2026-trailer-video-update.zip
          if-no-files-found: error
