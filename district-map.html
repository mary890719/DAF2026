<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>臺北圓山街區｜2026 臺北數位藝術節</title>
        <link rel="alternate" hreflang="zh-Hant" href="district-map.html">
        <link rel="alternate" hreflang="en" href="en/district-map.html">
        <link rel="stylesheet" href="assets/css/style.css?v=20260920-ia-split-v2">
    </head>
    <body data-page="district-map">
        <div id="site-header"></div>
        <main id="app" class="container">
            <div id="breadcrumb"></div>
            <h1 class="page-title">探索地圖</h1>
            <div class="map-legend" aria-label="地圖圖例">
                <span data-location-type="outdoor"><i aria-hidden="true"></i>主展場戶外</span>
                <span data-location-type="district"><i aria-hidden="true"></i>街區</span>
            </div>
            <div class="page-sections map-contexts">
<section class="ia-section map-context" id="district-map" data-map-context="district">
                    <h2>臺北圓山街區</h2>
                    <p class="map-legend-note">標記重疊時，點擊即可展開並選擇作品展示位置。</p>
                    <div class="map-shell map-shell-district" data-map-id="district">
                        <div class="map-base-layer"><img class="map-base" src="assets/images/map/活動場域MAP_Noword.png" alt="活動街區場域地圖"></div>
                        <div class="map-overlay-layer" data-map-markers></div>
                        <div class="map-ui-layer"><article class="marker-card" hidden></article></div>
                    </div>
                    <div class="map-work-list" data-map-list="district" data-map-list-type="outdoor"><strong>主展場戶外作品</strong></div>
                    <div class="map-work-list" data-map-list="district" data-map-list-type="district"><strong>臺北圓山街區</strong></div>
                </section>
            </div>
            <div class="back-wrap"><a class="button" href="district-works.html">臺北圓山街區作品資訊 &gt;</a></div>
        </main>
        <div id="site-footer"></div>
        <script src="assets/js/data.js?v=20260910-sponsors-perception-split-v1"></script>
        <script src="assets/js/components.js?v=20260920-ia-split-v2"></script>
        <script src="assets/js/app.js?v=20260920-ia-split-v2"></script>
    </body>
</html>
