name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包 Jed Berk 維護公告更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("wordpress-theme")
          paths = ["daf2026/assets/js/data.js", "daf2026/assets/js/app.js"]
          data = (root / paths[0]).read_text(encoding="utf-8")
          app = (root / paths[1]).read_text(encoding="utf-8")
          zh = '"maintenanceNote": "每日11:30-13:30為作品維護時間，暫停參觀"'
          en = '"maintenanceNoteEn": "Daily maintenance: 11:30–13:30. The artwork will be temporarily closed to visitors during this period."'
          assert data.count(zh) == 2, "Expected one note in works and one in mapWorks"
          assert data.count(en) == 2, "Expected one English note in each collection"
          assert app.count("data-work-maintenance-note") >= 1
          assert 'querySelector("[data-work-description]")' in app
          assert 'insertAdjacentElement("afterend", note)' in app
          assert "map-list-maintenance-note" in app
          assert "marker-work-maintenance-note" in app
          assert 'textFor(catalogWork, "maintenanceNote")' in app
          output = "daf2026-jed-berk-maintenance-update.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              assert archive.testzip() is None
          print("Verified", output)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-jed-berk-maintenance-update
          path: daf2026-jed-berk-maintenance-update.zip
          if-no-files-found: error
