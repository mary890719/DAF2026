name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 打包業主七項修改增量更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("wordpress-theme")
          paths = ["daf2026/assets/css/style.css","daf2026/assets/js/app.js","daf2026/assets/js/components.js","daf2026/assets/js/data.js","daf2026/functions.php","daf2026/page-curatorial.php","daf2026/page-partners.php","daf2026/page-program.php","daf2026/page-map.php","daf2026/page-en-map.php","daf2026/page-district-map.php"]
          for name in paths:
              assert (root / name).is_file(), f"缺少檔案: {name}"
          with ZipFile("daf2026-owner-seven-updates.zip", "w", ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(root / name, arcname=name)
          with ZipFile("daf2026-owner-seven-updates.zip") as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              print("已驗證本次增量檔案:", *archive.namelist(), sep="\\n")
          assert "MindAR" not in (root / "daf2026/page-map.php").read_text()
          assert "PERCEPTION" not in (root / "daf2026/page-map.php").read_text()
          assert "MindAR" not in (root / "daf2026/page-en-map.php").read_text()
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-owner-seven-updates
          path: daf2026-owner-seven-updates.zip
          if-no-files-found: error
