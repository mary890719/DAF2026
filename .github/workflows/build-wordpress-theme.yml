name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包 11 月現場導覽三檔更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re

          # 僅打包本輪導覽修改涉及的三個檔案，保留 Theme 目錄結構。
          root = Path("wordpress-theme")
          paths = [
              "daf2026/assets/js/data.js",
              "daf2026/assets/js/app.js",
              "daf2026/assets/css/style.css",
          ]
          data, app, css = [(root / p).read_text(encoding="utf-8") for p in paths]
          assert not re.search(r"}\\s*,\\s*,", data), "Invalid duplicate comma in data.js"
          expected = {
              "2026.11.07": ["14:00", "15:00", "16:00"],
              "2026.11.08": ["15:00", "16:00"],
              "2026.11.14": ["14:00", "15:00", "16:00"],
              "2026.11.15": ["15:00", "16:00"],
          }
          # 逐筆確認日期及開始時間，避免漏場或多場。
          matches = re.findall(r'"id": "(tour-[^"]+)"[\\s\\S]{0,480}?"date": "([^"]+)"[\\s\\S]{0,100}?"startTime": "([^"]+)"', data)
          for date, times in expected.items():
              actual = [start for _, d, start in matches if d == date]
              assert actual == times, f"Tour mismatch {date}: {actual}"
          assert "const toursByDate = new Map()" in app
          assert 'events.map(event => event.startTime).filter(Boolean).join("、")' in app
          assert ".guide-tour-date-times {" in css
          output = "daf2026-november-guided-tours-update.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in paths:
                  archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              assert archive.testzip() is None
              for name in paths:
                  assert archive.read(name) == (root / name).read_bytes()
          print("Verified", output, paths)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-november-guided-tours-update
          path: daf2026-november-guided-tours-update.zip
          if-no-files-found: error
