name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 驗證 JavaScript 與 PHP 語法
        run: |
          node --check wordpress-theme/daf2026/assets/js/components.js
          node --check wordpress-theme/daf2026/assets/js/data.js
          node --check wordpress-theme/daf2026/assets/js/app.js
          php -l wordpress-theme/daf2026/front-page.php
          php -l wordpress-theme/daf2026/page-en.php

      - name: 驗證並打包手機 Header CSS 更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("wordpress-theme")
          name = "daf2026/assets/css/style.css"
          css = (root / name).read_text(encoding="utf-8")
          assert css.count("@media (max-width: 1135px)") == 1
          start = css.index("@media (max-width: 1135px)")
          block = css[start:start + 850]
          assert ".site-header > .logo.logo-lockup {" in block
          assert "max-width: calc(100% - 60px);" in block
          assert ".site-header > .logo.logo-lockup .site-logo-image {" in block
          assert "max-width: 100%;" in block
          assert ".site-header > .menu-toggle {" in block
          assert "flex: 0 0 48px;" in block
          assert "height: 54px;" in css
          assert css.count("{") == css.count("}"), "CSS brace mismatch"
          output = "daf2026-mobile-header-menu-fix.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              archive.write(root / name, arcname=name)
          with ZipFile(output) as archive:
              assert archive.namelist() == [name]
              assert archive.testzip() is None
          print("Verified", output)
          PY

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-mobile-header-menu-fix
          path: daf2026-mobile-header-menu-fix.zip
          if-no-files-found: error
