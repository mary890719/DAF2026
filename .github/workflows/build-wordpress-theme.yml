name: 打包 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress-theme-v1
    paths:
      - "wordpress-theme/daf2026/**"
      - ".github/workflows/build-wordpress-theme.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 Repository
        uses: actions/checkout@v4

      - name: 打包 DAF2026 Theme
        run: |
          cd wordpress-theme
          zip -r ../daf2026.zip daf2026 \
            -x '*/node_modules/*' '*/dome備用/*' '*/hero*backup*' '*/Hero*backup*' '*/backup/*' '*/temp/*' '*/tmp/*' '*.bak' '*.tmp'

      - name: 打包 Header 與預告片增量更新
        run: |
          set -e
          cd wordpress-theme
          zip ../daf2026-header-trailer-update.zip \\
            'daf2026/assets/css/style.css' \\
            'daf2026/assets/js/components.js'
          cd ..
          zipinfo -1 daf2026-header-trailer-update.zip | sort > /tmp/actual.txt
          printf '%s\\n' 'daf2026/assets/css/style.css' 'daf2026/assets/js/components.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          grep -q 'RspktCLMWWo/hqdefault.jpg' wordpress-theme/daf2026/assets/css/style.css
          grep -q 'height: 54px;' wordpress-theme/daf2026/assets/css/style.css
          grep -q 'height: 44px;' wordpress-theme/daf2026/assets/css/style.css

      - name: 上傳 Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-wordpress-theme
          path: daf2026.zip
          if-no-files-found: error

      - name: 上傳本次更新 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daf2026-header-trailer-update
          path: daf2026-header-trailer-update.zip
          if-no-files-found: error
