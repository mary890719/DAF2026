<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>MAP｜2026 Taipei Digital Art Festival</title>
        <link rel="alternate" hreflang="zh-Hant" href="../map.html">
        <link rel="alternate" hreflang="en" href="map.html">
        <link rel="stylesheet" href="../assets/css/style.css?v=20260828-store-gallery-v1">
    </head>
    <body data-page="map">
        <div id="site-header"></div>
        <main id="app" class="container">
            <div id="breadcrumb"></div>
            <h1 class="page-title">MAP</h1>
            <div class="map-legend" aria-label="Map legend">
                <span data-location-type="main"><i aria-hidden="true"></i>MAIN VENUE</span>
                <span data-location-type="outdoor"><i aria-hidden="true"></i>OUTDOOR VENUE</span>
                <span data-location-type="district"><i aria-hidden="true"></i>DISTRICT</span>
            </div>
            <div class="page-sections map-contexts">
                <section class="ia-section map-context" id="garden-map" data-map-context="garden">
                    <h2>臺北典藏植物園展場平面圖</h2>
                    <div class="map-shell map-shell-garden" data-map-id="main">
                        <div class="map-base-layer"><img class="map-base" src="../assets/images/map/主展場MAP.png" alt="Taipei Collectible Botanical Garden main venue map with visitor facilities and exits"></div>
                        <div class="map-overlay-layer" data-map-markers></div>
                        <div class="map-ui-layer"><article class="marker-card" hidden></article></div>
                    </div>
                    <div class="map-work-list" data-map-list="main"><strong>WORKS</strong></div>
                </section>
                <section class="ia-section map-context" id="district-map" data-map-context="district">
                    <h2>DISTRICT MAP</h2>
                    <div class="map-shell map-shell-district" data-map-id="district">
                        <div class="map-base-layer"><img class="map-base" src="../assets/images/map/活動場域MAP_Noroad.png" alt="District program venue map"></div>
                        <div class="map-overlay-layer" data-map-markers></div>
                        <div class="map-ui-layer"><article class="marker-card" hidden></article></div>
                    </div>
                    <div class="map-work-list" data-map-list="district" data-map-list-type="outdoor"><strong>OUTDOOR WORKS</strong></div>
                    <div class="map-work-list" data-map-list="district" data-map-list-type="district"><strong>DISTRICT / ART IN STORES</strong></div>
                </section>
                <section class="ia-section shop-section" id="partner-stores">
                    <h2>PARTNER STORES</h2>
                    <div class="shop-list" data-shop-list="partners"></div>
                </section>
                <section class="ia-section shop-section" id="art-in-stores">
                    <h2>ART IN STORES</h2>
                    <div class="shop-list" data-shop-list="venues"></div>
                    <div class="shop-detail-layer" data-shop-detail-layer hidden>
                        <article class="shop-detail-panel" role="dialog" aria-modal="true" aria-labelledby="shop-detail-title" hidden></article>
                    </div>
                </section>
            </div>
            <div class="back-wrap"><a class="button" href="works.html">DETAILS &gt;</a></div>
        </main>
        <div id="site-footer"></div>
        <script src="../assets/js/data.js?v=20260828-store-gallery-v1"></script>
        <script src="../assets/js/components.js?v=20260827-logos-v5"></script>
        <script src="../assets/js/app.js?v=20260828-store-gallery-v1"></script>
    </body>
</html>
