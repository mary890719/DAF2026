<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <title>作品詳細｜2026 臺北數位藝術節</title>
        <meta name="description" content="2026 臺北數位藝術節參展作品資訊。">
        <meta name="theme-color" content="#000000">
        <link rel="alternate" hreflang="zh-Hant" href="work-detail.html">
        <link rel="alternate" hreflang="en" href="../en/work-detail.html">
        <link rel="stylesheet" href="../assets/css/style.css?v=20260907-share-scroll-v1">
    </head>
    <body data-page="work-detail">
        <div id="site-header"></div>
        <main class="container detail-page work-detail" id="main-content">
            <div id="breadcrumb"></div>
            <section class="detail-not-found" data-work-error hidden><h2>找不到此作品</h2><p><a class="button" href="works.html">返回作品介紹</a></p></section>
            <article class="detail-shell" data-work-detail>
                <section class="detail-left">
                    <header class="detail-header">
                        <p class="detail-number" data-work-number></p>
                        <h1 class="detail-title" data-work-title></h1>
                        <p class="detail-creators" data-work-creator-names></p>
                    </header>
                    <section class="detail-information" aria-labelledby="work-information-title">
                        <h2 id="work-information-title">作品資訊</h2>
                        <dl class="detail-meta">
                            <div data-work-field="year">
                                <dt>創作年份</dt>
                                <dd data-work-year></dd>
                            </div>
                            <div data-work-field="workType">
                                <dt>作品類型</dt>
                                <dd data-work-workType></dd>
                            </div>
                            <div data-work-field="medium">
                                <dt>創作媒材</dt>
                                <dd data-work-medium></dd>
                            </div>
                            <div data-work-field="location">
                                <dt>展出地點</dt>
                                <dd data-work-location></dd>
                            </div>
                        </dl>
                        <div class="work-links" data-work-links hidden></div>
                    </section>
                    <section class="detail-content" data-work-description-section>
                        <h2>作品介紹</h2>
                        <div data-work-description></div>
                    </section>
                    <section class="detail-media" data-work-gallery-section>
                        <h2>作品圖片</h2>
                        <div class="gallery" data-work-gallery></div>
                    </section>
                </section>
                <section class="detail-media" aria-labelledby="work-artists-title">
                    <div data-work-primary-media></div>
                    <h2 id="work-artists-title">藝術家</h2>
                    <div class="artist-copy" data-work-artists></div>
                </section>
                <div class="share">
                    <span>分享至</span>
                    <span class="share-native-wrap">
                        <button type="button" data-share-native aria-label="分享此頁" aria-haspopup="menu" aria-expanded="false">
                            <img class="icon" src="../assets/icons/share.svg" alt="" aria-hidden="true">
                        </button>
                        <span class="copy-link-toast" role="status" aria-live="polite" aria-atomic="true"><img class="icon" src="../assets/icons/link.svg" alt="" aria-hidden="true"><span></span></span>
                    </span>
                </div>
                <nav class="detail-navigation pager" aria-label="作品導覽">
                    <a data-work-previous>
                        <span>←　上一件作品</span>
                        <br>
                        <span data-work-previous-title></span>
                    </a>
                    <a data-work-next>
                        <span>下一件作品　→</span>
                        <br>
                        <span data-work-next-title></span>
                    </a>
                </nav>
                <div data-work-map-slot hidden></div>
            </article>
            <nav class="detail-return-navigation back-wrap" aria-label="返回導覽"><a class="button" href="index.html">&lt; 返回首頁</a><a class="button" href="works.html">返回作品介紹</a></nav>
            <noscript><p class="container detail-page-noscript">本頁需要啟用 JavaScript 才能顯示作品資訊。</p></noscript>
        </main>
        <div id="site-footer"></div>
        <script src="../assets/js/data.js?v=20260910-sponsors-perception-split-v1"></script>
        <script src="../assets/js/components.js?v=20260910-sponsors-perception-split-v1"></script>
        <script src="../assets/js/app.js?v=20260907-share-scroll-v1"></script>
    </body>
</html>
